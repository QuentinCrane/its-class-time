name: Build Windows Installer

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run Windows engine tests
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          cmake -S windows -B windows\build\engine -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build windows\build\engine || exit /b 1
          windows\build\engine\engine_tests.exe "%CD%" || exit /b 1

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore windows\packages.config -OutputDirectory windows\packages

      - name: Generate C++/WinRT projection headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'windows').Path
          $cppwinrt = Join-Path $root 'packages\Microsoft.Windows.CppWinRT.2.0.240111.5\bin\cppwinrt.exe'
          if (-not (Test-Path -LiteralPath $cppwinrt)) {
            throw "cppwinrt.exe not found at $cppwinrt"
          }

          $sdkWinmd = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\UnionMetadata\*\Windows.winmd' |
            Where-Object { $_.Directory.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Directory.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkWinmd) {
            throw 'Windows SDK Windows.winmd not found.'
          }
          Write-Host "Using Windows SDK metadata: $sdkWinmd"

          $winAppSdkLib = Join-Path $root 'packages\Microsoft.WindowsAppSDK.1.6.250602001\lib'
          $rawWinmds = Get-ChildItem -Path $winAppSdkLib -Recurse -Filter '*.winmd' |
            Where-Object { $_.FullName -match '\\uap10\.0' }
          $selected = @{}
          foreach ($f in ($rawWinmds | Sort-Object FullName)) {
            $selected[$f.Name] = $f.FullName
          }

          $webViewWinmds = Get-ChildItem -Path (Join-Path $root 'packages\Microsoft.Web.WebView2.1.0.2651.64\lib') -Recurse -Filter '*.winmd' -ErrorAction SilentlyContinue
          foreach ($f in $webViewWinmds) {
            if (-not $selected.ContainsKey($f.Name)) {
              $selected[$f.Name] = $f.FullName
            }
          }

          $outDir = Join-Path $root 'Generated Files'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $argsList = @('-input', $sdkWinmd)
          foreach ($path in ($selected.Values | Sort-Object)) {
            Write-Host "WinMD input: $path"
            $argsList += @('-input', $path)
          }
          $argsList += @('-output', $outDir)

          & $cppwinrt @argsList
          if ($LASTEXITCODE -ne 0) {
            throw "cppwinrt.exe failed with exit code $LASTEXITCODE"
          }

          foreach ($req in @('winrt\Windows.Foundation.h', 'winrt\Microsoft.UI.Xaml.h', 'winrt\Microsoft.UI.Xaml.XamlTypeInfo.h', 'winrt\Microsoft.Windows.AppNotifications.h')) {
            $full = Join-Path $outDir $req
            if (-not (Test-Path -LiteralPath $full)) {
              throw "Expected generated projection header missing: $full"
            }
          }

      - name: Install Inno Setup 7.1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' `
            -OutFile $installer
          Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$installDir") `
            -Wait
          $iscc = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found after Inno Setup install: $iscc"
          }
          Write-Host "Installed Inno Setup: $iscc"

      - name: Build Windows offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup7\ISCC.exe'
          .\windows\tools\build-installer.ps1 -Compiler $iscc
          Get-ChildItem windows\build\release\ItsClassTime-*-Windows-x64-Setup.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            Write-Host "Built: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB) SHA256=$hash"
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/build/release/ItsClassTime-*-Windows-x64-Setup.exe
          if-no-files-found: error
